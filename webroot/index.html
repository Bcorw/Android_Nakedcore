<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" data-theme-mode="system">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#08090b">
  <title>Nakedcore</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script>
    // 在首屏渲染前应用主题，避免闪烁
    (function () {
      try {
        var mode = localStorage.getItem('nc.theme') || 'system'
        var dark = mode === 'dark' || (mode === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.documentElement.dataset.themeMode = mode
      } catch (e) { /* ignore */ }
    })()
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="26" height="26">
            <defs>
              <linearGradient id="brandGradient" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#8fb0ff"/>
                <stop offset=".55" stop-color="#5f86ff"/>
                <stop offset="1" stop-color="#28d4b8"/>
              </linearGradient>
            </defs>
            <path d="M16 2.4 28 9.4v13.2L16 29.6 4 22.6V9.4z" fill="url(#brandGradient)"/>
            <path d="m17.4 8.6-6 9.1h4.2l-1.1 6.1 6.4-9.7h-4.3z" fill="#fff"/>
          </svg>
        </div>
        <div class="brand__text">
          <div class="brand__title">Nakedcore</div>
          <div class="brand__sub" id="brand-sub">内核 · 订阅 · 控制台</div>
        </div>
      </div>
      <div class="topbar__actions">
        <span class="chip chip--ghost" id="preview-chip" hidden>预览</span>
        <span class="chip chip--ghost" id="version-chip">v3.3.2</span>
        <button class="iconbtn" id="log-btn" type="button" data-action="console.open" data-icon="terminal" aria-label="运行与日志" title="运行与日志"></button>
        <button class="iconbtn" id="theme-btn" type="button" data-action="theme.cycle" aria-label="切换主题" title="切换主题"></button>
      </div>
    </header>

    <main class="main" id="main">
      <section class="page is-active" id="page-home" data-page="home">
        <div id="home-body"></div>
      </section>
      <section class="page" id="page-core" data-page="core">
        <div id="core-body"></div>
      </section>
      <section class="page" id="page-config" data-page="config">
        <div id="config-body"></div>
      </section>
    </main>

    <button class="console" id="console" type="button" data-action="console.open" aria-label="打开运行日志">
      <span class="console__topline"></span>
      <span class="console__inner">
        <span class="console__dot" id="console-dot"></span>
        <span class="console__icon" id="console-icon"></span>
        <span class="console__text" id="console-text">等待指令执行</span>
        <span class="console__meta" id="console-meta"></span>
        <span class="console__chevron" id="console-chevron"></span>
      </span>
    </button>

    <nav class="tabbar" aria-label="主导航">
      <button class="tab is-active" type="button" data-nav="home">
        <span class="tab__icon" data-icon="home"></span>
        <span class="tab__label">主页</span>
      </button>
      <button class="tab" type="button" data-nav="core">
        <span class="tab__icon" data-icon="core"></span>
        <span class="tab__label">核心</span>
      </button>
      <button class="tab" type="button" data-nav="config">
        <span class="tab__icon" data-icon="sliders"></span>
        <span class="tab__label">配置</span>
      </button>
    </nav>
  </div>

  <div id="sheet-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="true"></div>

  <script src="app.js" defer></script>
</body>
</html>
